name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  pytest:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install packaging pytest

      - name: Run pytest
        run: python -m pytest
