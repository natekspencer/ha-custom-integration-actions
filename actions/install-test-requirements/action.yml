name: Install test requirements
description: Install an integration's test requirements for a Home Assistant version
inputs:
  homeassistant-version:
    description: Home Assistant version to install
    required: true
  requirements-file:
    description: Requirements file of the integration
    required: false
    default: requirements_test.txt
runs:
  using: composite
  steps:
    - name: Install requirements
      shell: bash
      env:
        HOMEASSISTANT_VERSION: ${{ inputs.homeassistant-version }}
        REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
      run: |
        python -m pip install packaging uv
        python "$GITHUB_ACTION_PATH/../../scripts/install_test_requirements.py" \
          "$HOMEASSISTANT_VERSION" "$REQUIREMENTS_FILE"
